    <script>
      var infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      var mapContainer = document.getElementById("map"),
        mapOption = {
          center: new kakao.maps.LatLng(37.29803324573562, 126.83879424585795),
          level: 7,
        };

      var map = new kakao.maps.Map(mapContainer, mapOption);

      var positions = [
        {
          title: "처리중",
          latlng: new kakao.maps.LatLng(37.498095, 127.02761),
        },
        {
          title: "미완료",
          latlng: new kakao.maps.LatLng(37.493923, 127.014656),
        },
      ];

      positions.forEach(function (position) {
        var marker = new kakao.maps.Marker({
          map: map,
          position: position.latlng,
          title: position.title,
        });
      });
      function setCenter() {
        var moveLatLon = new kakao.maps.LatLng(33.452613, 126.570888);

        map.setCenter(moveLatLon);
      }
    </script>
    <script>
      //get으로 포트홀 데이터 가져오기
      fetch("http://localhost:3000/potholes") // 백엔드 API 호출
        .then((response) => response.json())
        .then((data) => {
          // 데이터 순회하며 마커 생성
          data.forEach((pothole) => {
            var marker = new kakao.maps.Marker({
              map: map, // 지도 객체xitude), // 위도, 경도, pothole.timestamp, afasdjfadf
              position: new kakao.maps.LatLng(
                pothole.latitude,
                pothole.longitude
              ), // 위도, 경도
              title: pothole.location, // 마커 타이틀
            });

            // 마커에 정보창 추가
            var infowindow = new kakao.maps.InfoWindow({
              content: `<div style="padding:5px;">위치: ${pothole.location}<br>상태: ${pothole.status}</div>`, // 정보창 내용
            });

            // 마커 클릭 이벤트
            kakao.maps.event.addListener(marker, "click", function () {
              infowindow.open(map, marker); // 마커 클릭 시 정보창 열기
            });
          });
        })
        .catch((error) => console.error("포트홀 정보 가져오기 실패:", error));
    </script>
